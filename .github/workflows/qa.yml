name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * *" # nightly regression against the live demo (14:17 UTC)
  workflow_dispatch:

# One run at a time: the API under test has per-IP and per-user rate limits.
concurrency:
  group: qa-live-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-checks:
    name: Type-check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  e2e:
    name: Playwright (API, UI, accessibility)
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests
        run: npx playwright test
      - name: Publish results to the job summary
        if: always()
        run: node scripts/summarize-junit.mjs test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14
      - name: Prepare report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  publish-report:
    name: Publish test report
    needs: e2e
    if: always() && github.ref == 'refs/heads/main' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: GitHub Actions; don't fail the run if Pages is off.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  performance:
    name: k6 load test
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled'
    steps:
      - uses: actions/checkout@v6
      - uses: grafana/setup-k6-action@v1
      - name: Run load test
        run: k6 run perf/load-test.js
      - name: Publish summary
        if: always()
        run: cat perf-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: perf-summary.*
